<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, intial-scale=1.0">
		<link rel="stylesheet" href="style1.css">
		<title> Registration form of NSFAS MONEY MANAGER </title>
	</head>
	<body>
		<div class="login-box">
			<h2>Let's get started</h2>
			<form action="dashboard.html">
				<div class="input-box">
					<input type="text" id="First name" required>
					<label for="First name">First name</label>
					<span></span>
				</div>
				<div class="input-box">
					<input type="text" id="Last name" required>
					<label for="Last name">Last name</label>
					<span></span>
				</div>
				<div class="input-box">
					<input type="text" id="password" required>
					<label for="password">Create password</label>
					<span></span>
				</div>
				<div class="input-box">
					<input type="text" id="password" required>
					<label for="password">Confrm password</label>
					<span></span>
				</div>
				<div class="input-box">
					<input type="number" inputmode="numeric" placeholder="e.g 203067667" pattern="[0-9]" id="number" required>
					<label for="number">Student number</label>
					<span></span>
				</div>
				<div class="input-box">
					<input type="number" inputmode="numeric" name="phone" placeholder="e.g 0765532555" pattern="[0-9]" id="phone" required>
					<label for="phone">Phone number</label>
					<span></span>
				</div>
				<div class="options">
					<label>
					<p>Select Gender:</p>
						<select>
						<option>Male<option/>
						<option>Female</option>
						</select>
					</label>
					
				</div>
				<button type="submit">Register Now</button>
				<div class="register">
					<h3>Already have an account?click here👉
						<a href="Login.html">Login</a>
					</h3>
				</div>
				
				
			</form>
		</div>

		
	</body>
